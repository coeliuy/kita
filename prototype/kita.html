<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kita: time, invoices and take-home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F6F3F0; --surface:#FFFFFF; --ink:#1F1A17; --muted:#6B625B; --line:#E4DDD6;
  --accent:#C2410C; --accent-ink:#FFFFFF; --soft:#FCEBDD; --warn:#806300; --warn-soft:#FAF1CC;
  --bad:#B42318; --bad-soft:#FBE4E1; --field:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110F; --surface:#1C1815; --ink:#EEE8E3; --muted:#A39890; --line:#352D27;
    --accent:#FB8A3C; --accent-ink:#1A0F08; --soft:#2E1E13; --warn:#E8C547; --warn-soft:#2B2612;
    --bad:#F07A6F; --bad-soft:#331A18; --field:#171310;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14110F; --surface:#1C1815; --ink:#EEE8E3; --muted:#A39890; --line:#352D27;
  --accent:#FB8A3C; --accent-ink:#1A0F08; --soft:#2E1E13; --warn:#E8C547; --warn-soft:#2B2612;
  --bad:#F07A6F; --bad-soft:#331A18; --field:#171310;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-weight:500;line-height:1.2;margin:0}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:19px}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;min-height:56px}
.brand{font-weight:600;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.pill{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);min-width:0}
.pill.on{color:var(--ink)}
.pill .live{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill .live{animation:none}}
.pill .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill b{font-weight:500}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);max-width:1180px;margin:0 auto}
#nav{padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);align-self:start}
#nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:11px}
#nav button:hover{color:var(--ink);background:var(--soft)}
#nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
#nav button:focus-visible{outline:2px solid var(--accent)}
#nav .spacer{height:1px;background:var(--line);margin:10px 10px}
svg.i{width:20px;height:20px;flex:none}
main{padding:24px 28px 80px;min-width:0}
#tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
#tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:5px 6px;border-radius:10px;min-width:56px}
#tabbar button[aria-current="page"]{color:var(--accent)}
#tabbar button:focus-visible{outline:2px solid var(--accent)}
@media (max-width:780px){
  .app{grid-template-columns:1fr}
  #nav{display:none}
  #tabbar{display:flex}
  main{padding:14px 12px calc(88px + env(safe-area-inset-bottom,0px))}
  .top{padding:8px 16px}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .figs{grid-template-columns:1fr 1fr;gap:16px 18px}
  .fig .v{font-size:24px}
  .fig.hero .v{font-size:28px}
  .cols>div:nth-child(even)>span{visibility:hidden}
}

.view>section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.view>section.bare{background:none;border:0;padding:6px 2px 4px}
.view>section .panel{background:var(--bg);border-color:transparent}
@media (max-width:780px){.view>section{padding:18px 16px;border-radius:16px}}
.menu-item{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.menu-item:last-child{border-bottom:0}
.menu-item svg{color:var(--accent)}
.menu-item b{display:block;font-weight:500}
.menu-item small{color:var(--muted);font-size:13px}
.menu-item:focus-visible{outline:2px solid var(--accent)}
.live{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;display:inline-block;animation:blink 1.6s infinite}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
button.brand{all:unset;cursor:pointer;font-weight:600;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
button.brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* landing */
#landing{display:none}
body.is-home #landing{display:block}
body.is-home .top,body.is-home .app,body.is-home #tabbar{display:none!important}
body.is-home::before{background:var(--bg)}
.l-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px max(clamp(16px,5vw,48px), calc((100% - 1120px) / 2 + clamp(16px,5vw,48px)));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.l-wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,5vw,48px)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;padding:48px 0 80px}
.hero h1{font-size:clamp(40px,6vw,74px);line-height:1.02;letter-spacing:-.035em;font-weight:500}
.lede{font-size:19px;line-height:1.55;color:var(--muted);margin:22px 0 30px;max-width:46ch}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:12px}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 40px 80px -40px rgba(120,50,10,.35)}
.mock .clock{font-size:clamp(52px,6vw,68px);margin:8px 0 6px;color:var(--ink)}
.mock .bar{margin:8px 0 2px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:36px;padding:24px 0 56px}}
.l-sec{padding:72px 0;border-top:1px solid var(--line)}
.l-sec h2{font-size:clamp(28px,3.6vw,42px);letter-spacing:-.025em;max-width:20ch;margin-bottom:16px}
.intro{font-size:18px;line-height:1.6;color:var(--muted);max-width:58ch}
.meaning{display:grid;grid-template-columns:auto 1fr;gap:24px 56px;align-items:center}
.meaning .word{font-size:clamp(96px,16vw,200px);font-weight:500;letter-spacing:-.055em;line-height:.85;color:var(--accent)}
@media (max-width:700px){.meaning{grid-template-columns:1fr}}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:36px 40px;margin-top:40px}
.feat svg{color:var(--accent);width:26px;height:26px}
.feat h3{margin:12px 0 6px;font-size:18px;font-weight:500}
.feat p{color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:40px 0 0}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:22px 0;border-top:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s);font-size:32px;font-weight:300;color:var(--accent);line-height:1}
.steps h3{font-size:18px;font-weight:500;margin-bottom:4px}
.steps p{color:var(--muted);max-width:60ch}
.faq{margin-top:28px;max-width:760px}
.faq details{border-top:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:500;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-weight:300;font-size:22px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{color:var(--muted);margin-top:10px;max-width:64ch}
.cta{padding:80px 0 96px;border-top:1px solid var(--line)}
.cta h2{font-size:clamp(32px,5vw,56px);letter-spacing:-.03em;margin-bottom:24px}
.l-foot{padding:24px 0 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

.clock{font-weight:300;font-size:clamp(64px,13vw,128px);line-height:1;letter-spacing:-.035em;margin:4px 0 18px}
.clock.idle{color:var(--line)}
.running-note{font-size:17px;margin-bottom:14px}
.running-note b{font-weight:500}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f.grow{flex:1 1 220px}
label.check{display:flex;gap:8px;align-items:center;font-size:14px}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
textarea{min-height:72px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input[type=color]{padding:2px;height:40px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:500}
.btn.link:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[data-armed]{color:var(--bad);border-color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty .btn{margin-top:12px}

.day{margin-bottom:18px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 0 6px;border-bottom:1px solid var(--line)}
.entry{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%}
.entry .t{font-weight:500}
.entry .m{font-size:13px;color:var(--muted)}
.dur{font-weight:500;text-align:right}
.acts{display:flex;gap:2px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--ink);vertical-align:1px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.good{background:var(--soft);color:var(--accent)}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 28px}
.fig .v{font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1.15}
.fig .l{font-size:13px;color:var(--muted)}
.fig.hero .v{font-size:40px;color:var(--accent);font-weight:400}

.cl{display:grid;grid-template-columns:minmax(140px,220px) minmax(100px,1fr) minmax(190px,auto);gap:6px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cl .nm{display:flex;gap:8px;align-items:center;font-weight:500;min-width:0}
.cl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:10px;background:var(--soft);border-radius:99px;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.bar>i.over{background:var(--bad)}
.bar>i.near{background:var(--warn)}
.bar .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.cl .num{text-align:right;font-size:14px;white-space:nowrap}
.cl .note{grid-column:1/-1;font-size:13px}

.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.cols>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.cols>div>i{width:100%;max-width:22px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.cols>div.we>i{opacity:.4}
.cols>div>span{font-size:10px;color:var(--muted)}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.total td{font-weight:600;border-bottom:0}
td input{padding:6px 8px}

.prog{height:14px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px}
.callout.info{border-color:var(--accent);background:var(--soft)}
.fine{font-size:13px;color:var(--muted);max-width:72ch}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.stack>*+*{margin-top:12px}
.sep{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv.strong{font-weight:600;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <button class="brand" data-act="nav" data-view="home" aria-label="About Kita"><i></i>Kita</button>
  <div class="pill" id="pill"></div>
</header>
<div class="app">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="view"><div class="loading">Loading your data…</div></main>
</div>
<div id="tabbar" role="navigation" aria-label="Sections"></div>
<div id="landing"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GBP = new Intl.NumberFormat('en-GB', {style:'currency', currency:'GBP'});
const GBP0 = new Intl.NumberFormat('en-GB', {style:'currency', currency:'GBP', maximumFractionDigits:0});
const gbp = n => GBP.format(n || 0);
const gbp0 = n => GBP0.format(Math.round(n || 0));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const hm = min => { min = Math.round(min || 0); return `${Math.floor(min/60)}:${pad(min%60)}`; };
const hrsTxt = min => `${(min/60).toFixed(1)} h`;
const fmtDate = s => s ? parseYmd(s).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const monthLabel = k => new Date(+k.slice(0,4), +k.slice(5,7)-1, 1).toLocaleDateString('en-GB', {month:'long', year:'numeric'});
const monthEnd = k => ymd(new Date(+k.slice(0,4), +k.slice(5,7), 0));
const shiftMonth = (k, n) => { const d = new Date(+k.slice(0,4), +k.slice(5,7)-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const csvq = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
const clean = o => JSON.parse(JSON.stringify(o));

/* tax years run 6 April to 5 April */
const tyOf = s => { const [y,m,d] = s.split('-').map(Number); return (m > 4 || (m === 4 && d >= 6)) ? y : y - 1; };
const tyRange = y => [`${y}-04-06`, `${y+1}-04-05`];
const tyLabel = y => `${y}/${String(y+1).slice(2)}`;
const inRange = (s, [a,b]) => s >= a && s <= b;
const quarters = y => [[`${y}-04-06`,`${y}-07-05`],[`${y}-07-06`,`${y}-10-05`],[`${y}-10-06`,`${y+1}-01-05`],[`${y+1}-01-06`,`${y+1}-04-05`]];

const COLORS = ['#1F6F5C','#3B6FB6','#B5541E','#7A4FB0','#A1306B','#5E7F1E','#2C8A9E','#8A6D1F'];
const CATS = ['Office costs and equipment','Travel','Clothing (uniforms only)','Staff and subcontractors','Things you buy to resell','Bank and financial costs','Business premises','Advertising and marketing','Software and subscriptions','Training courses','Other allowable costs'];
const DEFAULTS = {
  name:'', business:'', address:'', email:'', payment:'',
  invPrefix:'INV-', nextInv:1, terms:'30', vat:false, vatRate:20,
  otherIncome:0, goal:0, goalType:'gross', taxSaved:0,
  tax:{pa:12570, basicBand:37700, addl:125140, taper:100000, r1:20, r2:40, r3:45, c4lo:12570, c4hi:50270, c4a:6, c4b:2},
  timer:null, theme:''
};
const mergeSettings = v => ({...DEFAULTS, ...v, tax:{...DEFAULTS.tax, ...((v && v.tax) || {})}});

let S = {settings:mergeSettings({}), clients:[], entries:[], expenses:[], invoices:[]};
const UI = {view:'track', week:0, month:today().slice(0,7), ty:tyOf(today()), editEntry:null, editClient:null, editExpense:null, inv:null};

/* ---------- storage: private cloud rows when available, browser storage otherwise ---------- */
const KINDS = {client:'clients', entry:'entries', expense:'expenses', invoice:'invoices'};
const LS = 'tally-v1';
const capDownloads = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }
function fail(e){ console.warn(e); toast('That change didn’t save. Check your connection and try again.'); }
const Store = {
  mode:'local', db:null, base:null, _st:null,
  async init(){
    try {
      if (window.claude && window.claude.use) {
        const db = await window.claude.use('db');
        if (db) {
          const u = await window.claude.use('user');
          const id = u ? await u.id() : null;
          if (id) { this.db = db; this.base = 'data/users/' + id; this.mode = 'cloud'; }
        }
      }
    } catch(e){ console.warn(e); }
  },
  async load(){
    if (this.mode === 'cloud') {
      const snap = await this.db.collection(this.base).get();
      for (const d of snap.docs) {
        const v = d.data(); if (!v) continue;
        if (d.id === 'settings') S.settings = mergeSettings(v);
        else if (KINDS[v.kind]) S[KINDS[v.kind]].push(v);
      }
    } else {
      try {
        const raw = localStorage.getItem(LS);
        if (raw) { const o = JSON.parse(raw); S = {...S, ...o, settings:mergeSettings(o.settings || {})}; }
      } catch(e){}
    }
  },
  put(kind, obj){
    const list = S[KINDS[kind]]; const i = list.findIndex(x => x.id === obj.id);
    if (i >= 0) list[i] = obj; else list.push(obj);
    return this.write(kind + '_' + obj.id, {...obj, kind});
  },
  del(kind, id){
    S[KINDS[kind]] = S[KINDS[kind]].filter(x => x.id !== id);
    if (this.mode === 'cloud') return this.db.collection(this.base).doc(kind + '_' + id).delete().catch(fail);
    saveLocal(); return Promise.resolve();
  },
  write(docId, data){
    if (this.mode === 'cloud') return this.db.collection(this.base).doc(docId).set(clean(data)).catch(fail);
    saveLocal(); return Promise.resolve();
  },
  saveSettings(now){
    clearTimeout(this._st);
    if (now) return this.write('settings', S.settings);
    this._st = setTimeout(() => this.write('settings', S.settings), 400);
  }
};

/* ---------- money maths ---------- */
const client = id => S.clients.find(c => c.id === id);
const activeClients = () => S.clients.filter(c => !c.archived).sort((a,b) => a.name.localeCompare(b.name));
const entriesIn = (a, b, cid) => S.entries.filter(e => e.date >= a && e.date <= b && (!cid || e.clientId === cid));
const sumMin = list => list.reduce((t, e) => t + (+e.minutes || 0), 0);
const billMin = list => sumMin(list.filter(e => e.billable !== false));
const invSubtotal = lines => lines.reduce((t, l) => t + (+l.qty || 0) * (+l.unit || 0), 0);

function workValue(c, billableMinutes){
  if (!c) return 0;
  const h = billableMinutes / 60;
  if (c.billing === 'hourly') return h * (+c.rate || 0);
  if (c.billing === 'retainer') return (+c.fee || 0) + Math.max(0, h - (+c.included || 0)) * (+c.rate || 0);
  return 0;
}
function incomeTax(total, t){
  let pa = t.pa;
  if (total > t.taper) pa = Math.max(0, pa - (total - t.taper) / 2);
  const tx = Math.max(0, total - pa);
  const b = Math.min(tx, t.basicBand);
  const h = Math.min(Math.max(tx - t.basicBand, 0), Math.max(t.addl - t.basicBand, 0));
  const a = Math.max(tx - t.addl, 0);
  return b * t.r1/100 + h * t.r2/100 + a * t.r3/100;
}
function class4(p, t){
  return Math.max(0, Math.min(p, t.c4hi) - t.c4lo) * t.c4a/100 + Math.max(0, p - t.c4hi) * t.c4b/100;
}
function taxOn(profit){
  const t = S.settings.tax, other = +S.settings.otherIncome || 0, p = Math.max(0, profit);
  const it = incomeTax(other + p, t) - incomeTax(other, t);
  const ni = class4(p, t);
  return {it, ni, total: it + ni};
}
function yearFigures(y){
  const r = tyRange(y);
  const inv = S.invoices.filter(i => inRange(i.issueDate, r));
  const income = inv.reduce((t, i) => t + (+i.subtotal || 0), 0);
  const exp = S.expenses.filter(x => inRange(x.date, r)).reduce((t, x) => t + (+x.amount || 0), 0);
  const profit = income - exp;
  const tax = taxOn(profit);
  const mins = sumMin(entriesIn(r[0], r[1]));
  return {income, exp, profit, tax, net: profit - tax.total, mins};
}
function yearProgress(y){
  const [a, b] = tyRange(y), t = today();
  if (t < a) return 0; if (t > b) return 1;
  return Math.min(1, Math.max(0.02, (parseYmd(t) - parseYmd(a)) / (parseYmd(b) - parseYmd(a))));
}
function monthData(key){
  const a = key + '-01', b = monthEnd(key);
  const ents = entriesIn(a, b);
  const rows = S.clients.map(c => {
    const es = ents.filter(e => e.clientId === c.id);
    const min = sumMin(es), bmin = billMin(es);
    const invoicedHere = S.invoices.filter(i => i.clientId === c.id && i.period === key);
    let value;
    if (c.billing === 'fixed') value = S.invoices.filter(i => i.clientId === c.id && i.issueDate >= a && i.issueDate <= b).reduce((t,i) => t + i.subtotal, 0);
    else if (c.billing === 'retainer') value = (min > 0 || !c.archived) ? workValue(c, bmin) : 0;
    else value = workValue(c, bmin);
    return {c, min, bmin, value, invoiced: invoicedHere.length > 0};
  }).filter(r => r.min > 0 || r.value > 0 || (r.c.billing === 'retainer' && !r.c.archived));
  const unbilled = rows.filter(r => !r.invoiced && r.c.billing !== 'fixed').reduce((t, r) => t + r.value, 0);
  return {rows, mins: sumMin(ents), value: rows.reduce((t, r) => t + r.value, 0), unbilled, ents};
}
function dueFrom(issue){
  const d = parseYmd(issue);
  if (S.settings.terms === 'eofm') return ymd(new Date(d.getFullYear(), d.getMonth() + 2, 0));
  d.setDate(d.getDate() + (+S.settings.terms || 30));
  return ymd(d);
}
function parseDur(s){
  s = String(s || '').trim().toLowerCase(); let m;
  if (!s) return 0;
  if ((m = s.match(/^(\d+):(\d{1,2})$/))) return +m[1]*60 + +m[2];
  if ((m = s.match(/^(\d+(?:\.\d+)?)\s*m(?:in(?:ute)?s?)?$/))) return Math.round(+m[1]);
  if ((m = s.match(/^(\d+(?:\.\d+)?)\s*h?(?:rs?|ours?)?$/))) return Math.round(+m[1] * 60);
  if ((m = s.match(/^(\d+)\s*h\s*(\d+)\s*m?$/))) return +m[1]*60 + +m[2];
  return 0;
}
function elapsed(){
  const t = S.settings.timer; if (!t) return '0:00:00';
  const s = Math.max(0, Math.floor((Date.now() - t.startedAt) / 1000));
  return `${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;
}

function tySelect(){

V.money = () => {
  const y = UI.ty, f = yearFigures(y), s = S.settings, prog = yearProgress(y);
  const live = prog > 0 && prog < 1;
  const projProfit = live ? f.profit / prog : f.profit, projIncome = live ? f.income / prog : f.income;
  const projTax = taxOn(projProfit), projNet = projProfit - projTax.total;
  const rate = projIncome > 0 ? projTax.total / projIncome : 0;
  const pot = +s.taxSaved || 0, potGap = f.tax.total - pot;
  const goal = +s.goal || 0, isNet = s.goalType === 'net';
  const got = isNet ? f.net : f.income;
  const [, tyEnd] = tyRange(y);
  const te = parseYmd(tyEnd), tn = new Date();
  const monthsLeft = live ? Math.max(1, (te.getFullYear() - tn.getFullYear()) * 12 + te.getMonth() - tn.getMonth() + 1) : 0;
  const remaining = Math.max(0, goal - got);
  let grossNeeded = remaining;
  if (isNet && remaining > 0) { let lo = 0, hi = remaining * 3 + 1000; for (let i = 0; i < 60; i++) { const mid = (lo+hi)/2; const p = f.profit + mid; const n = p - taxOn(p).total; if (n - f.net >= remaining) hi = mid; else lo = mid; } grossNeeded = hi; }
  const avgRate = f.mins > 0 ? f.income / (f.mins / 60) : 0;
  const hoursNeeded = avgRate > 0 ? grossNeeded / avgRate : 0;
  const goalPace = live ? goal * prog : goal;
  const poa = (projTax.total > 1000);
  const qs = quarters(y).map(([a,b], i) => {
    const inc = S.invoices.filter(x => inRange(x.issueDate, [a,b])).reduce((t,x)=>t+x.subtotal,0);
    const ex = S.expenses.filter(x => inRange(x.date, [a,b])).reduce((t,x)=>t+(+x.amount||0),0);
    return {i, a, b, inc, ex};
  });
  return `
  <section><div class="head"><h1>Money</h1>${tySelect()}</div>
    <div class="split">
      <div class="panel">
        <h3 style="margin-bottom:8px">${tyLabel(y)} so far</h3>
        <div class="kv"><span>Invoiced${s.vat ? ' (excluding VAT)' : ''}</span><span>${gbp(f.income)}</span></div>
        <div class="kv"><span>Business expenses</span><span>− ${gbp(f.exp)}</span></div>
        <div class="kv strong"><span>Profit</span><span>${gbp(f.profit)}</span></div>
        <div class="kv"><span>Income Tax on this profit</span><span>− ${gbp(f.tax.it)}</span></div>
        <div class="kv"><span>Class 4 National Insurance</span><span>− ${gbp(f.tax.ni)}</span></div>
        <div class="kv strong" style="color:var(--accent)"><span>Take-home</span><span>${gbp(f.net)}</span></div>
      </div>
      <div class="stack">
        <div class="fig hero"><div class="v">${Math.round(rate * 100)}%</div><div class="l">Set aside this share of every payment for your tax bill${live ? ', based on your pace this year' : ''}</div></div>
        ${live ? `<div class="panel"><h3 style="margin-bottom:6px">If you keep this pace all year</h3>
          <div class="kv"><span>Income</span><span>${gbp0(projIncome)}</span></div>
          <div class="kv"><span>Tax and NI</span><span>${gbp0(projTax.total)}</span></div>
          <div class="kv strong"><span>Take-home</span><span>${gbp0(projNet)}</span></div></div>` : ''}
        <label class="f"><span>Other taxable income this year, such as a salary (£)</span><input type="number" step="1" min="0" data-set="otherIncome" value="${s.otherIncome || ''}" placeholder="0"></label>
        <p class="fine">A salary uses up your tax-free allowance and lower bands first, so your freelance profit is taxed on top of it. Leaving this blank makes the estimate too low.</p>
      </div>
    </div>
  </section>
  <section>
    <div class="head"><h2>Tax pot</h2></div>
    <div class="split">
      <div class="stack">
        <label class="f"><span>Saved for tax so far (£)</span><input type="number" step="1" min="0" data-set="taxSaved" value="${pot || ''}" placeholder="0"></label>
        <div class="prog"><i style="width:${f.tax.total > 0 ? Math.min(100, pot / f.tax.total * 100) : 0}%"></i></div>
        <p>${f.tax.total <= 0 ? 'No tax due on this year’s profit yet.' : potGap > 0 ? `Move <b>${gbp0(potGap)}</b> into your tax savings to cover what you owe so far.` : `You’re covered, with ${gbp0(-potGap)} to spare.`}</p>
      </div>
      <div class="stack">
        <div class="callout info">The bill for ${tyLabel(y)} is due by 31 January ${y + 2}.</div>
        ${poa ? `<div class="callout">Your bill looks likely to be over £1,000. If most of it isn’t already collected through PAYE, HMRC will usually ask for payments on account: two advance payments towards next year, each half of this year’s bill, due 31 January and 31 July. That can make your first January payment much larger than expected.</div>` : ''}
      </div>
    </div>
  </section>
  <section>
    <div class="head"><h2>Earnings goal</h2></div>
    <div class="grid" style="max-width:560px">
      <label class="f"><span>Goal for ${tyLabel(y)} (£)</span><input type="number" step="100" min="0" data-set="goal" value="${goal || ''}" placeholder="e.g. 40000"></label>
      <label class="f"><span>Measured as</span><select data-set="goalType"><option value="gross" ${!isNet?'selected':''}>Income invoiced</option><option value="net" ${isNet?'selected':''}>Take-home after tax</option></select></label>
    </div>
    ${goal ? `
      <div class="prog" style="max-width:720px"><i style="width:${Math.min(100, got/goal*100)}%"></i></div>
      <p class="sub">${gbp0(got)} of ${gbp0(goal)} (${Math.round(got/goal*100)}%)${live ? `. At this point in the year you’d be on pace at ${gbp0(goalPace)}, so you’re <b style="color:${got >= goalPace ? 'var(--accent)' : 'var(--warn)'}">${got >= goalPace ? gbp0(got - goalPace) + ' ahead' : gbp0(goalPace - got) + ' behind'}</b>.` : '.'}</p>
      ${remaining > 0 && live ? `<div class="figs" style="margin-top:16px">
        <div class="fig"><div class="v">${gbp0(grossNeeded / monthsLeft)}</div><div class="l">to invoice each month for the ${monthsLeft} month${monthsLeft === 1 ? '' : 's'} left</div></div>
        ${avgRate ? `<div class="fig"><div class="v">${Math.round(hoursNeeded / monthsLeft)} h</div><div class="l">a month at your average of ${gbp0(avgRate)}/h</div></div>` : ''}
        ${isNet ? `<div class="fig"><div class="v">${gbp0(grossNeeded)}</div><div class="l">more income needed before tax</div></div>` : ''}
      </div>` : remaining <= 0 ? `<p style="margin-top:10px"><span class="tag good">Goal reached</span></p>` : ''}` : `<p class="fine" style="margin-top:8px">Set a goal to see whether you’re on pace and how many hours it will take.</p>`}
  </section>
  <section>
    <div class="head"><h2>Quarterly totals</h2><button class="btn sm" data-act="exportQuarters">Download CSV</button></div>
    <div class="tw"><table><thead><tr><th>Quarter</th><th>Period</th><th class="r">Income</th><th class="r">Expenses</th><th class="r">Profit</th></tr></thead><tbody>
      ${qs.map(q => `<tr><td>Q${q.i+1}</td><td>${fmtDate(q.a)} to ${fmtDate(q.b)}</td><td class="r">${gbp(q.inc)}</td><td class="r">${gbp(q.ex)}</td><td class="r">${gbp(q.inc - q.ex)}</td></tr>`).join('')}
      <tr class="total"><td colspan="2">Year</td><td class="r">${gbp(f.income)}</td><td class="r">${gbp(f.exp)}</td><td class="r">${gbp(f.profit)}</td></tr>
    </tbody></table></div>
    <p class="fine" style="margin-top:10px">These follow the Making Tax Digital quarters. Sole traders above the income threshold send HMRC a summary like this each quarter through compatible software; the CSV breaks expenses down by category to make that easier.</p>
  </section>
  <section><p class="fine">All figures are estimates, not tax advice. They use the England, Wales and Northern Ireland rates in Settings and count income when you issue an invoice. They don’t include student loan repayments, Scottish tax bands, pension contributions, or other reliefs. Check your actual bill with HMRC or an accountant.</p></section>`;
};

/* ---------- actions ---------- */
function arm(el, fn){
  if (el.dataset.armed) { fn(); return; }
  const old = el.textContent; el.dataset.armed = '1'; el.textContent = 'Click again to confirm';
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = old; } }, 3000);
}
function startInvoice(clientId, month){
  const cid = clientId || (activeClients()[0] || {}).id;
  const m = month || UI.month || today().slice(0,7);
  const pf = prefill(cid, m);
  UI.inv = {clientId: cid, month: m, issueDate: today(), note: UI.inv ? UI.inv.note : '', ...pf};
}
function prefill(cid, month){
  const c = client(cid); const ml = monthLabel(month);
  if (!c) return {lines:[{desc:'', qty:1, unit:0}], entryIds:[]};
  const es = entriesIn(month + '-01', monthEnd(month), cid).filter(e => !e.invoiceId && e.billable !== false);
  let lines = [];
  if (c.billing === 'hourly') {
    const g = {}; es.forEach(e => { const k = e.task || 'Work'; g[k] = (g[k] || 0) + e.minutes; });
    lines = Object.entries(g).map(([t, m]) => ({desc:`${t} (${ml})`, qty:+(m/60).toFixed(2), unit:+c.rate || 0}));
  } else if (c.billing === 'retainer') {
    const h = sumMin(es) / 60;
    lines = [{desc:`Monthly retainer, ${ml} (${c.included || 0} hours included)`, qty:1, unit:+c.fee || 0}];
    const over = h - (+c.included || 0);
    if (over > 0.01 && +c.rate) lines.push({desc:`Additional hours beyond the retainer, ${ml}`, qty:+over.toFixed(2), unit:+c.rate});
  } else lines = [{desc:'Project fee', qty:1, unit:+c.fee || 0}];
  if (!lines.length) lines = [{desc:'', qty:1, unit:0}];
  return {lines, entryIds: es.map(e => e.id)};
}
async function saveInvoice(){
  const v = UI.inv, c = client(v.clientId);
  const lines = v.lines.filter(l => l.desc || +l.unit);
  if (!c || !lines.length) { toast('Add at least one line with a description or price.'); return; }
  const sub = invSubtotal(lines), vat = S.settings.vat ? sub * (+S.settings.vatRate||0) / 100 : 0;
  const inv = {id:uid(), number:S.settings.invPrefix + pad3(S.settings.nextInv), clientId:c.id, clientName:c.name, period:v.month,
    issueDate:v.issueDate, dueDate:dueFrom(v.issueDate), lines, subtotal:+sub.toFixed(2), vat:+vat.toFixed(2), total:+(sub+vat).toFixed(2),
    status:'unpaid', note:v.note || '', entryIds:v.entryIds, createdAt:Date.now()};
  S.settings.nextInv = (+S.settings.nextInv || 1) + 1;
  UI.inv = null;
  await Store.put('invoice', inv);
  for (const id of inv.entryIds) { const e = S.entries.find(x => x.id === id); if (e) await Store.put('entry', {...e, invoiceId:inv.id}); }
  Store.saveSettings(true);
  render(); toast(`Created ${inv.number}`);
}
async function stopTimer(save){
  const t = S.settings.timer; if (!t) return;
  S.settings.timer = null;
  const minutes = Math.round((Date.now() - t.startedAt) / 60000);
  if (save && minutes >= 1) {
    await Store.put('entry', {id:uid(), clientId:t.clientId, task:t.task, note:'', date:ymd(new Date(t.startedAt)), minutes, billable:true, createdAt:Date.now()});
    toast(`Saved ${hm(minutes)}`);
  } else if (save) toast('Less than a minute, so nothing was saved.');
  Store.saveSettings(true); render();
}
async function saveFile(filename, data){
  try {
    const dl = await capDownloads;
    if (dl) { await dl.save({filename, data}); return; }
  } catch(e) { if (e && (e.code === 'declined')) return; if (e && e.code === 'rate_limited') { toast('Another download is waiting for confirmation.'); return; } }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], {type:'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  } catch(e) { toast('Downloads aren’t available here.'); }
}
function invoicePdf(inv){
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:'mm', format:'a4'});
  const s = S.settings, c = client(inv.clientId) || {name:inv.clientName};
  const L = 20, R = 190; let y = 24;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.text('Invoice', L, y);
  doc.setFontSize(11); doc.text(inv.number, R, y, {align:'right'});
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); y += 12;
  const from = [s.business || s.name, s.business ? s.name : '', ...(s.address || '').split('\n'), s.email].filter(Boolean);
  const to = [c.name, ...(c.address || '').split('\n'), c.email].filter(Boolean);
  doc.setTextColor(110); doc.text('From', L, y); doc.text('Bill to', 85, y); doc.text('Issued', 150, y); doc.setTextColor(20);
  let yy = y + 5; from.forEach(l => { doc.text(l, L, yy); yy += 5; });
  let yt = y + 5; to.forEach(l => { doc.text(l, 85, yt); yt += 5; });
  doc.text(fmtDate(inv.issueDate), 150, y + 5);
  doc.setTextColor(110); doc.text('Due', 150, y + 12); doc.setTextColor(20); doc.text(fmtDate(inv.dueDate), 150, y + 17);
  y = Math.max(yy, yt, y + 22) + 8;
  doc.setDrawColor(200); doc.line(L, y, R, y); y += 6;
  doc.setTextColor(110); doc.text('Description', L, y); doc.text('Qty', 130, y, {align:'right'}); doc.text('Unit price', 160, y, {align:'right'}); doc.text('Amount', R, y, {align:'right'});
  doc.setTextColor(20); y += 3; doc.line(L, y, R, y); y += 6;
  inv.lines.forEach(l => {
    const desc = doc.splitTextToSize(l.desc || '', 95);
    if (y + desc.length * 5 > 265) { doc.addPage(); y = 24; }
    doc.text(desc, L, y);
    doc.text(String(+l.qty), 130, y, {align:'right'}); doc.text(gbp(l.unit), 160, y, {align:'right'}); doc.text(gbp((+l.qty||0)*(+l.unit||0)), R, y, {align:'right'});
    y += desc.length * 5 + 3;
  });
  doc.line(L, y, R, y); y += 7;
  const tot = (label, val, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(label, 160, y, {align:'right'}); doc.text(val, R, y, {align:'right'}); y += 6; };
  tot('Subtotal', gbp(inv.subtotal)); if (inv.vat) tot(`VAT at ${s.vatRate}%`, gbp(inv.vat)); tot('Total due', gbp(inv.total), true);
  doc.setFont('helvetica', 'normal'); y += 6;
  if (s.payment) { doc.setTextColor(110); doc.text('Payment details', L, y); doc.setTextColor(20); y += 5; doc.splitTextToSize(s.payment, 170).forEach(l => { doc.text(l, L, y); y += 5; }); y += 3; }
  if (inv.note) { doc.splitTextToSize(inv.note, 170).forEach(l => { doc.text(l, L, y); y += 5; }); }
  return doc.output('blob');
}

async function clearWhere(pred){

    return;
  }
  const u = el.dataset.ui;
  if (u === 'ty') { UI.ty = +el.value; render(); }
  else if (u === 'billing') {
    const fd = new FormData(el.form);
    const base = UI.editClient !== 'new' ? (client(UI.editClient) || {}) : {};
    UI.clientDraft = {...base, name:fd.get('name'), billing:el.value, color:fd.get('color'), rate:fd.get('rate'), fee:fd.get('fee'), included:fd.get('included'), email:fd.get('email'), address:fd.get('address'), archived:!!fd.get('archived')};
    render();
  }
  else if (u === 'invClient') { UI.inv.clientId = el.value; Object.assign(UI.inv, prefill(UI.inv.clientId, UI.inv.month)); render(); }
  else if (u === 'invMonth') { UI.inv.month = el.value; Object.assign(UI.inv, prefill(UI.inv.clientId, UI.inv.month)); render(); }
  else if (u === 'invIssue') { UI.inv.issueDate = el.value || today(); updateTotals(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.line !== undefined && UI.inv) {
    const l = UI.inv.lines[+el.dataset.line]; const f = el.dataset.field;
    l[f] = f === 'desc' ? el.value : (el.value === '' ? 0 : +el.value);
    const a = document.querySelector(`[data-amt="${el.dataset.line}"]`); if (a) a.textContent = gbp((+l.qty||0)*(+l.unit||0));
    updateTotals();
  } else if (el.dataset.ui === 'invNote' && UI.inv) UI.inv.note = el.value;
});
function updateTotals(){
  const sub = invSubtotal(UI.inv.lines), vat = S.settings.vat ? sub * (+S.settings.vatRate||0) / 100 : 0;
  const t = $('#invTotals'); if (t) t.innerHTML = totalsHtml(sub, vat);
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ROUTES.includes(h) && h !== UI.view) { UI.view = h; render(); window.scrollTo(0, 0); } });
let demoSec = 5047;
setInterval(() => {
  if (S.settings.timer) document.querySelectorAll('[data-elapsed]').forEach(n => n.textContent = elapsed());
  const d = document.querySelector('[data-demo]'); if (d) { demoSec++; d.textContent = `${Math.floor(demoSec/3600)}:${pad(Math.floor(demoSec/60)%60)}:${pad(demoSec%60)}`; }
}, 1000);

(async function boot(){
  const h = location.hash.slice(1);
  await Store.init();
  try { await Store.load(); } catch(e) { console.warn(e); toast('Couldn’t load your saved data.'); }
  if (ROUTES.includes(h)) UI.view = h; else if (!S.clients.length) UI.view = 'home';
  applyTheme(); render();
})();
</script>
</body>
